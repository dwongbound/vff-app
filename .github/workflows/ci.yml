name: CI

# Every push and PR runs the same three gates a developer runs locally:
# typecheck, unit tests, then the e2e suite against a real Postgres and a real
# Next server. Nothing here is mocked — the e2e job seeds the database exactly
# the way `docker compose --profile test` does.
on:
  # EVERY branch, not just main: a feature branch that only gets tested once a
  # PR is opened is a branch you've already built on top of. `publish` is the
  # job that stays main-only, and it guards itself (see its `if:`).
  push:
  # Kept alongside `push` for the one case pushes can't cover: a PR from a
  # fork, whose branch lives in someone else's repo and never fires a push
  # event here.
  pull_request:
  # Lets you re-run the suite from the Actions tab without pushing anything.
  workflow_dispatch:

# A second push to the same branch cancels the run already in flight; the old
# result would be thrown away anyway.
#
# This is also what stops a PR'd branch running the suite TWICE, and the two
# halves have to be spelled the SAME WAY for that to work. On a pull_request
# event `head_ref` is the bare source branch ("add-widget"); on a push,
# `ref_name` is the bare branch too ("add-widget") where `ref` would be the
# fully-qualified "refs/heads/add-widget". Pairing `head_ref` with `ref` — as
# this did — produces "ci-add-widget" for the PR and "ci-refs/heads/add-widget"
# for the push: two different groups, so neither cancels the other and every
# PR ran the whole suite twice, in parallel, for the same commit.
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  # Reservation and flight dates are interpreted in the club's zone (see
  # instrumentation.ts) — pin it so a runner in UTC can't shift a test's idea
  # of "today" across a date boundary.
  APP_TZ: America/Los_Angeles
  TZ: America/Los_Angeles

jobs:
  # Fast feedback: types and pure logic, no database needed.
  unit:
    name: Typecheck & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.1
          cache: npm

      - name: Install dependencies
        # `prisma generate` runs on postinstall and reads DATABASE_URL from the
        # config, so it has to be set even though nothing connects here.
        run: npm ci
        env:
          DATABASE_URL: postgresql://vff:vff@localhost:5432/vff_test

      - run: npm run typecheck

      - run: npm run test:unit

  # One job per layout, in parallel. The three projects are independent suites
  # (see playwright.config.ts) and each leg gets its OWN runner and its own
  # Postgres service, which is what makes running them at once safe: the specs
  # share a database within a leg — global-setup resets and reseeds it — and
  # legs share nothing at all. Serialising them behind one runner meant the
  # slowest shape set the wall clock for the whole gate.
  e2e:
    name: E2E (${{ matrix.project }})
    runs-on: ubuntu-latest
    # Every shape is worth running even when another fails — "it breaks on a
    # phone" and "it breaks everywhere" are different bugs and you want to know
    # which one you have on the first run. There's still no point booting
    # Postgres if the code doesn't compile.
    needs: unit

    strategy:
      fail-fast: false
      matrix:
        include:
          - project: desktop
            # Which engine to download. NOT cosmetic and NOT uniform: only the
            # desktop project is Chromium. Playwright's iPad/iPhone descriptors
            # are Safari device profiles and default to WEBKIT, so installing
            # chromium alone left those two legs with no browser to launch
            # ("Executable doesn't exist at .../webkit-NNNN/pw_run.sh"). It
            # passed locally because a dev machine has all the engines from the
            # first `playwright install`.
            #
            # Webkit is also the RIGHT engine here rather than a chore to work
            # around: an iPhone member is on Safari, and a phone-shaped Chromium
            # would miss exactly the bugs these two legs exist to catch.
            browser: chromium
          - project: ipad
            browser: webkit
          - project: iphone
            browser: webkit

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: vff
          POSTGRES_PASSWORD: vff
          POSTGRES_DB: vff_test
        ports:
          - 5433:5432
        # Give the job a database that's actually accepting connections rather
        # than one that has merely started.
        options: >-
          --health-cmd "pg_isready -U vff -d vff_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.1
          cache: npm

      - name: Write the test environment
        # Mirrors env.example/test.env. The e2e harness loads env/test.env
        # itself (playwright.config.ts + tests/e2e/global-setup.ts), so CI has
        # to materialise the file rather than relying on process env alone.
        run: |
          mkdir -p env
          cat > env/test.env <<'EOF'
          DATABASE_URL=postgresql://vff:vff@localhost:5433/vff_test
          NEXTAUTH_URL=http://localhost:3100
          NEXTAUTH_SECRET=ci-secret-not-a-real-one
          SEED_ADMIN_EMAIL=admin@vffclub.test
          SEED_ADMIN_PASSWORD=flyvff123
          SEED_TAIL_NUMBER=N8318B
          STORAGE_DRIVER=local
          STORAGE_LOCAL_DIR=storage/test-photos
          APP_TZ=America/Los_Angeles
          EOF

      - name: Install dependencies
        run: npm ci
        env:
          DATABASE_URL: postgresql://vff:vff@localhost:5433/vff_test

      - name: Install Playwright browsers
        # Only this leg's engine, so each download stays small — see the
        # matrix above for why it isn't the same one every time.
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Push the schema
        # global-setup force-resets and reseeds per run; this just makes sure
        # the database exists in the shape the client expects first.
        run: npx prisma db push
        env:
          DATABASE_URL: postgresql://vff:vff@localhost:5433/vff_test

      - name: Run the e2e suite
        run: npm run test:e2e -- --project=${{ matrix.project }}
        env:
          CI: "true"

      - name: Upload the Playwright report
        # The report is only interesting when something failed, and it's what
        # you need to work out WHY without reproducing locally.
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          # Suffixed, or the three legs race to upload under one name and only
          # one report survives — the wrong one, as often as not.
          name: playwright-report-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Builds the production image and pushes it to GitHub's own registry, so the
  # server never builds anything: it pulls a tag and restarts. The runner has
  # far more memory than a small VPS, and a failed build here can't take the
  # live site down with it.
  #
  # `needs` is what makes this safe — an image only exists for a commit whose
  # typecheck, unit tests and e2e suite all passed.
  # The production image runs `prisma migrate deploy` on boot, so prod's schema
  # is whatever prisma/migrations/ says — while dev still uses `db push`, which
  # writes no migration. Nothing stops the two drifting apart, and the symptom
  # would be a deploy that boots fine and then 500s on the one query touching
  # the column nobody migrated.
  #
  # This replays the migrations directory into a scratch database and diffs the
  # result against schema.prisma. Exit 2 = they disagree; run `npm run
  # db:migrate -- --name <what-you-changed>` and commit the migration.
  migrations:
    name: Migrations match the schema
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: vff
          POSTGRES_PASSWORD: vff
          POSTGRES_DB: vff_migrations
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U vff -d vff_migrations"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://vff:vff@localhost:5434/vff_migrations
      # Prisma replays the migrations in here and drops it again. It has to
      # exist and it has to be separate — the diff resets whatever it points at.
      SHADOW_DATABASE_URL: postgresql://vff:vff@localhost:5434/vff_shadow

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.1
          cache: npm

      - run: npm ci

      - name: Create the shadow database
        run: PGPASSWORD=vff psql -h localhost -p 5434 -U vff -d postgres -c 'CREATE DATABASE vff_shadow'

      - name: Check prisma/migrations matches prisma/schema.prisma
        run: |
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema prisma/schema.prisma \
            --exit-code

  publish:
    name: Build & push image
    runs-on: ubuntu-latest
    needs: [unit, e2e, migrations]
    # Only real merges to main get an image. Now that `push` fires on every
    # branch, this guard is doing more work than it used to: feature branches,
    # PRs and manual re-runs all run the test jobs above and stop here. The
    # `github.ref` half is the load-bearing part — don't reduce it to an
    # event_name check.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      # The one extra grant ghcr needs; GITHUB_TOKEN is otherwise read-only.
      packages: write

    steps:
      - uses: actions/checkout@v7

      # Buildx gives the layer cache below; the classic builder has no --cache-to.
      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Only amd64: Hetzner/DO/Vultr VPSes are x86_64, and adding arm64
          # doubles the build for a target nothing deploys to. If you ever run
          # this on an Ampere/Graviton box, add linux/arm64 here.
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          build-args: |
            COMMIT_SHA=${{ github.sha }}
          # Layer cache lives in the Actions cache, so an unchanged
          # package-lock.json skips the whole npm ci layer on the next run.
          cache-from: type=gha
          cache-to: type=gha,mode=max
