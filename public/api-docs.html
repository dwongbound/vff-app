<!doctype html>
<!--
  The club app's API reference: Swagger UI over /api/openapi. A static page in
  public/ (no route, no session — /api… paths are outside proxy.ts's matcher),
  with Swagger UI from a CDN at a pinned version so the app ships no docs
  dependency. Try-it-out sends a real request with whatever key is pasted into
  Authorize, straight from the reader's browser.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VFF API reference</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui.css" />
    <style>
      body { margin: 0; background: #fff; }
    </style>
  </head>
  <body>
    <div id="swagger"></div>
    <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui-bundle.js"></script>
    <script>
      // Keys are pasted into Authorize; never persisted by the page.
      window.ui = SwaggerUIBundle({
        url: "/api/openapi",
        dom_id: "#swagger",
        persistAuthorization: false,
        tryItOutEnabled: false,
      });
    </script>
  </body>
</html>
